name: dtmsn

# ── Phase M0 — Production Infrastructure Foundation ───────────────────────────
# Backing services only. The app itself runs on the host (npm run dev / vite)
# and connects to these containers via their published localhost ports — see
# docs/infrastructure.md for the full development/production workflow.
#
# All credentials come from .env (git-ignored). Copy .env.example (full local
# dev) or .env.template (infra-only, e.g. for a VPS) to .env before running:
#   docker compose up -d
#
# ── Phase X.9.4 addition — Application Container ──────────────────────────────
# Two OPT-IN services (Compose "profiles", never started by a bare `docker compose up -d`):
#   app      (profile: app) — the built production image (Dockerfile, target "runtime")
#   app-dev  (profile: dev) — the same image's dependency layer, source bind-mounted, run
#            directly via tsx for iteration without a rebuild
# Both join the SAME dtmsn_internal network as the existing backing services — no new network,
# no second compose file, no competing container strategy. Run with:
#   docker compose --profile app up -d --build   # production-shaped run
#   docker compose --profile dev up app-dev       # iterative development run
# Default `docker compose up -d` behavior (backing services only) is completely unchanged.

networks:
  dtmsn_internal:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  minio_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: dtmsn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dtmsn_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: dtmsn_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - dtmsn_internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/misc/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: dtmsn_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dtmsn_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: dtmsn_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - dtmsn_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot job: creates the buckets the Storage module needs, then exits.
  # Safe to re-run — `mc mb -p` is idempotent (no-op if the bucket already exists).
  minio-init:
    image: minio/mc:latest
    container_name: dtmsn_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dtmsn_internal
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET_ATTACHMENTS:-attachments} &&
      mc mb -p local/${MINIO_BUCKET_BACKUPS:-backups} &&
      exit 0
      "
    restart: "no"

  # ── Phase X.9.4: application container (opt-in, profile "app") ────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: dtmsn_app
    restart: unless-stopped
    profiles: ["app"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      STREAM_TIMEOUT_MS: ${STREAM_TIMEOUT_MS:-30000}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - dtmsn_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Phase X.9.4: application container, development variant (opt-in, profile "dev") ──
  # Source bind-mounted for fast iteration; runs the exact same src/server/main.ts entrypoint
  # via the exact same tsx runtime as `npm run server` on the host — no separate dev-only code
  # path, only a different launch context (container vs. host) and NODE_ENV.
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: dtmsn_app_dev
    restart: "no"
    profiles: ["dev"]
    working_dir: /app
    command: ["sh", "scripts/start-dev.sh"]
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      STREAM_TIMEOUT_MS: ${STREAM_TIMEOUT_MS:-30000}
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - dtmsn_internal
